name: Build iOS (TestFlight) 🚀

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, macOS]
    env:
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: beakbuddy-march2026.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: beakbuddy-march2026
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: beakbuddy-march2026.firebasestorage.app
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 15460675966
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:15460675966:ios:4ae864e4d28804daf6c32f
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 15460675966-im687q15ek2baoshkhlo3kbel63jttaf.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 15460675966-v6re102t627f123n3c754h6p6t2252p2.apps.googleusercontent.com
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install

      - name: Expo Prebuild (generate native iOS project)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Run Fastlane Beta → Build & Upload to TestFlight
        run: fastlane ios beta
