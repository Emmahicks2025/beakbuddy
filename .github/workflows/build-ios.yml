name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build IPA locally
        run: EXPO_NO_TELEMETRY=1 npx eas build --platform ios --profile production --local --non-interactive --output=./beakbuddy.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beakbuddy-ipa
          path: ./beakbuddy.ipa
