workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "beakbuddy"
        DEVELOPMENT_TEAM: "LZ57VL6474"
      node: 18.17.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile for Firebase compatibility
        script: |
          sed -i '' "s/  use_expo_modules!/  use_modular_headers!\n  use_expo_modules!/" ios/Podfile

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Write API key to file for Xcode signing
        script: |
          mkdir -p /tmp/authkeys
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/authkeys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          echo "API key written to /tmp/authkeys/"

      - name: Build iOS Archive (Xcode handles signing automatically)
        script: |
          xcodebuild \
            -workspace ios/beakbuddy.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/beakbuddy.xcarchive" \
            clean archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/authkeys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>LZ57VL6474</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/beakbuddy.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/authkeys \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - $CM_BUILD_DIR/output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: Codemagic
        key_id: 9T452HQ663
        issuer_id: 4f51e329-5618-4798-9bf8-04ab981312c7
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
