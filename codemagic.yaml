workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "BeakBuddyParrotTrainingAI"
        DEVELOPMENT_TEAM: "LZ57VL6474"
      node: 18.17.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Remove Push Notifications entitlement
        script: |
          # expo prebuild adds aps-environment even without expo-notifications.
          # Without it in the provisioning profile this causes xcodebuild exit 65.
          ENTITLEMENTS=$(find ios -name "*.entitlements" | head -1)
          if [ -n "$ENTITLEMENTS" ]; then
            plutil -remove aps-environment "$ENTITLEMENTS" 2>/dev/null || true
            echo "Stripped aps-environment from $ENTITLEMENTS"
          fi

      - name: Patch Podfile for Firebase compatibility
        script: |
          sed -i '' "s/  use_expo_modules!/  use_modular_headers!\n  use_expo_modules!/" ios/Podfile

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Write App Store Connect API key for Xcode
        script: |
          mkdir -p /tmp/authkeys
          KEY_PATH="/tmp/authkeys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"

          # APP_STORE_CONNECT_PRIVATE_KEY from Codemagic's integration is base64-encoded.
          # Detect to handle both raw PEM (contains "BEGIN") and base64 formats.
          if echo "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q "BEGIN"; then
            echo "Key is raw PEM — writing directly"
            printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo "Key is base64-encoded — decoding"
            echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi

          echo "First line of key file: $(head -1 $KEY_PATH)"
          echo "Key file size: $(wc -c < $KEY_PATH) bytes"

      - name: Build iOS Archive
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          echo "Using workspace: $WORKSPACE"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/beakbuddy.xcarchive" \
            clean archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/authkeys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Export IPA
        script: |
          python3 -c "import plistlib; plistlib.dump({'method':'app-store-connect','teamID':'LZ57VL6474','signingStyle':'automatic','destination':'export'}, open('/tmp/ExportOptions.plist','wb'), fmt=plistlib.FMT_XML)"

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/beakbuddy.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/authkeys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - $CM_BUILD_DIR/output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: Codemagic
        key_id: 9T452HQ663
        issuer_id: 4f51e329-5618-4798-9bf8-04ab981312c7
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
