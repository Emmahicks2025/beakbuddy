workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - api_keys
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "BeakBuddyParrotTrainingAI"
        DEVELOPMENT_TEAM: "LZ57VL6474"
      node: 18.17.0
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Inject Environment Variables
        script: |
          sed -i '' "s|process.env.EXPO_PUBLIC_GEMINI_API_KEY|'$EXPO_PUBLIC_GEMINI_API_KEY'|g" src/config.ts
          sed -i '' "s|process.env.EXPO_PUBLIC_FIREBASE_API_KEY|'$EXPO_PUBLIC_FIREBASE_API_KEY'|g" src/config.ts
          sed -i '' "s|process.env.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID|'$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID'|g" src/config.ts
          echo "Variables successfully hardcoded into config.ts for Metro Bundler"

      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Remove Push Notifications entitlement
        script: |
          ENTITLEMENTS=$(find ios -name "*.entitlements" | head -1)
          if [ -n "$ENTITLEMENTS" ]; then
            plutil -remove aps-environment "$ENTITLEMENTS" 2>/dev/null || true
            echo "Stripped aps-environment from $ENTITLEMENTS"
          fi

      - name: Patch Podfile for Firebase compatibility
        script: |
          # Add $RNFirebaseAsStaticFramework = true (required for React Native Firebase)
          python3 -c "f='ios/Podfile'; t=open(f).read(); open(f,'w').write(t.replace('prepare_react_native_project!','\$RNFirebaseAsStaticFramework = true\nprepare_react_native_project!',1) if '\$RNFirebaseAsStaticFramework' not in t else t)"
          echo '=== Podfile head (first 15 lines) ==='
          head -15 ios/Podfile
          echo '=== End Podfile head ==='

      - name: Install CocoaPods dependencies
        script: |
          # USE_FRAMEWORKS=static resolves React-RCTAppDelegate module compilation errors
          cd ios && USE_FRAMEWORKS=static pod install --repo-update

      - name: Set up code signing
        script: |
          # macOS LibreSSL syntax: bits come LAST
          openssl genrsa -out /tmp/cert_key.pem 2048
          echo "Key format: $(head -1 /tmp/cert_key.pem)"
          openssl rsa -in /tmp/cert_key.pem -check -noout && echo "Key is valid ✓"

          keychain initialize

          # Delete existing Distribution certs via REST API (avoids CLI output format guessing)
          python3 -c "import json,urllib.request,time,base64,pathlib; from cryptography.hazmat.primitives.serialization import load_pem_private_key; from cryptography.hazmat.primitives import hashes; from cryptography.hazmat.primitives.asymmetric import ec; from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature; k=load_pem_private_key(pathlib.Path('/Users/builder/.appstoreconnect/private_keys/AuthKey_9T452HQ663.p8').read_bytes(),password=None); ub=lambda d:base64.urlsafe_b64encode(d if isinstance(d,bytes) else d.encode()).rstrip(b'=').decode(); h=ub(json.dumps({'alg':'ES256','kid':'9T452HQ663','typ':'JWT'})); p=ub(json.dumps({'iss':'4f51e329-5618-4798-9bf8-04ab981312c7','iat':int(time.time()),'exp':int(time.time())+1200,'aud':'appstoreconnect-v1'})); der=k.sign((h+'.'+p).encode(),ec.ECDSA(hashes.SHA256())); r,s=decode_dss_signature(der); tok=h+'.'+p+'.'+ub(r.to_bytes(32,'big')+s.to_bytes(32,'big')); resp=json.load(urllib.request.urlopen(urllib.request.Request('https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=DISTRIBUTION&limit=25',headers={'Authorization':'Bearer '+tok}))); [urllib.request.urlopen(urllib.request.Request('https://api.appstoreconnect.apple.com/v1/certificates/'+c['id'],method='DELETE',headers={'Authorization':'Bearer '+tok})) or print('Deleted',c['id']) for c in resp.get('data',[])]" || true

          # Create Distribution cert + App Store provisioning profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/cert_key.pem

          keychain add-certificates

          # Apply profiles natively to the main project ONLY (avoids node_modules and Pods scanning issues)
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -1)
          xcode-project use-profiles --project "$PROJECT"

      - name: Build iOS Archive
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          echo "Using workspace: $WORKSPACE"
          mkdir -p /tmp/xcodebuild_logs
          # Run without global signing flags—xcode-project use-profiles already configured the main project
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/beakbuddy.xcarchive" \
            -derivedDataPath /tmp/xcode-dd \
            clean archive \
            2>&1 | tee /tmp/xcodebuild_logs/build.log; STATUS=${PIPESTATUS[0]}
          echo '=== ACTUAL BUILD ERRORS ==='
          grep -E '^.*(error:|fatal error:)' /tmp/xcodebuild_logs/build.log | grep -v 'note:' | head -30 || true
          echo '==========================='
          exit $STATUS

      - name: Export IPA
        script: |
          # Codemagic tools put profiles in UserData, NOT MobileDevice. Search both just in case.
          PROFILE=$(find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PROFILE" ]; then echo "ERROR: No provisioning profile found"; exit 1; fi
          
          UUID=$(security cms -D -i "$PROFILE" | python3 -c "import sys,plistlib; print(plistlib.loads(sys.stdin.buffer.read())['UUID'])")
          python3 -c "import plistlib; p={'method':'app-store-connect','teamID':'$DEVELOPMENT_TEAM','signingStyle':'manual','provisioningProfiles':{'$BUNDLE_ID':'$UUID'}}; plistlib.dump(p,open('/tmp/ExportOptions.plist','wb'),fmt=plistlib.FMT_XML)"
          
          echo "=== ExportOptions.plist ==="
          cat /tmp/ExportOptions.plist
          
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/beakbuddy.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Publish to TestFlight
        script: |
          app-store-connect publish \
            --path "$CM_BUILD_DIR/output/BeakBuddyParrotTrainingAI.ipa" \
            --key-id 9T452HQ663 \
            --issuer-id 4f51e329-5618-4798-9bf8-04ab981312c7 \
            --private-key "@file:/Users/builder/.appstoreconnect/private_keys/AuthKey_9T452HQ663.p8" \
            --testflight

    artifacts:
      - $CM_BUILD_DIR/output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
