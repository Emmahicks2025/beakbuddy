workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - ios_signing_creds
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "beakbuddy"
        DEVELOPMENT_TEAM: "LZ57VL6474"
      node: 18.17.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Run Expo Prebuild (generates iOS native project)
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile for Firebase compatibility
        script: |
          sed -i '' "s/  use_expo_modules!/  use_modular_headers!\n  use_expo_modules!/" ios/Podfile
          echo "Podfile patched — use_modular_headers added"

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Set up code signing
        script: |
          # Install provisioning profile
          PROFILE_UUID=$(security cms -D -i "$PROV_PROFILE" | grep -A1 UUID | grep string | sed 's/.*<string>\(.*\)<\/string>/\1/')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROV_PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "Installed profile: $PROFILE_UUID"

          # Initialize keychain and import certificate
          keychain initialize
          keychain add-certificates --certificate "$DIST_CERT" --certificate-password "$CERT_PASSWORD"

          # Configure Xcode project to use the installed profile
          xcode-project use-profiles

      - name: Build iOS .ipa for App Store
        script: |
          xcode-project build-ipa \
            --workspace "ios/beakbuddy.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: Codemagic
        key_id: 9T452HQ663
        issuer_id: 4f51e329-5618-4798-9bf8-04ab981312c7
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
