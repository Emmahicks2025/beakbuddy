workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "beakbuddy"
        DEVELOPMENT_TEAM: "LZ57VL6474"
      node: 18.17.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile for Firebase compatibility
        script: |
          sed -i '' "s/  use_expo_modules!/  use_modular_headers!\n  use_expo_modules!/" ios/Podfile

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Set up manual code signing
        script: |
          # ── Decode distribution certificate and install into keychain ──
          echo -n "$DIST_CERT_B64" | base64 --decode > /tmp/cert.p12

          # ── Decode provisioning profile and install ──
          echo -n "$PROV_PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | \
            grep -A1 UUID | grep string | \
            sed 's/.*<string>\(.*\)<\/string>/\1/')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed provisioning profile UUID: $UUID"

          # ── Initialize keychain and import certificate ──
          keychain initialize
          keychain add-certificates \
            --certificate /tmp/cert.p12 \
            --certificate-password "$CERT_PASSWORD"

          # ── Tell Codemagic's xcode-project tooling to use the profile ──
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/beakbuddy.xcworkspace" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: Codemagic
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
