workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic   # Uses the API key already saved in team settings

    environment:
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "beakbuddy"
        DEVELOPMENT_TEAM: "LZ57VL6474"
      node: 18.17.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile for Firebase compatibility
        script: |
          sed -i '' "s/  use_expo_modules!/  use_modular_headers!\n  use_expo_modules!/" ios/Podfile

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Set up automatic code signing
        script: |
          # Codemagic fetches/creates the cert + profile automatically using
          # the App Store Connect API key ("Codemagic") already in team settings.
          # No manual downloads. No base64. It handles rotation too.
          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key-password ""

          keychain add-certificates
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/beakbuddy.xcworkspace" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: Codemagic
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
