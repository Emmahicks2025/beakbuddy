workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic   # Uses the API key already saved in team settings

    environment:
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "BeakBuddyParrotTrainingAI"
        DEVELOPMENT_TEAM: "LZ57VL6474"
      node: 18.17.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Remove Push Notifications entitlement
        script: |
          # expo prebuild adds aps-environment even without expo-notifications.
          # Without it in the provisioning profile this causes xcodebuild exit 65.
          ENTITLEMENTS=$(find ios -name "*.entitlements" | head -1)
          if [ -n "$ENTITLEMENTS" ]; then
            plutil -remove aps-environment "$ENTITLEMENTS" 2>/dev/null || true
            echo "Stripped aps-environment from $ENTITLEMENTS"
          fi

      - name: Patch Podfile for Firebase compatibility
        script: |
          sed -i '' "s/  use_expo_modules!/  use_modular_headers!\n  use_expo_modules!/" ios/Podfile

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Set up automatic code signing
        script: |
          # Generate a fresh RSA private key for the distribution certificate.
          # This sidesteps "Cannot save Signing Certificates without certificate
          # private key" — instead of trying to reuse an existing cert whose
          # private key isn't available, we supply our own key and --create
          # makes a brand-new cert signed by it.
          openssl genrsa -out /tmp/cert_key.pem 2048

          keychain initialize

          # Remove existing distribution certs so the new key doesn't hit
          # Apple's 409 "already have a current Distribution certificate" limit.
          app-store-connect list-certificates --type DISTRIBUTION --json 2>/dev/null \
            | python3 -c "import json,sys,subprocess; [subprocess.run(['app-store-connect','delete-certificate',c['id']]) for c in json.load(sys.stdin).get('data',[])]" \
            || true

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/cert_key.pem

          keychain add-certificates
          # node_modules is no longer needed after pod install.
          # Removing it prevents use-profiles from crashing on
          # node_modules/@react-native-community/datetimepicker/ios/
          rm -rf node_modules
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          echo "Using workspace: $WORKSPACE"
          # use-profiles already wrote ~/export_options.plist — no need to
          # create one manually or pass --export-options-plist
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: Codemagic
        key_id: 9T452HQ663
        issuer_id: 4f51e329-5618-4798-9bf8-04ab981312c7
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
