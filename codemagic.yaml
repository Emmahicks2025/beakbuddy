workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "beakbuddy"
      node: 18.17.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Run Expo Prebuild (generates iOS native project)
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile for Firebase compatibility
        script: |
          sed -i '' "s/  use_expo_modules!/  use_modular_headers!\n  use_expo_modules!/" ios/Podfile
          echo "Podfile patched — use_modular_headers added"
          grep -n "use_modular_headers" ios/Podfile

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch signing files (uses stored BeakBuddy Distribution cert)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Build iOS .ipa for App Store
        script: |
          xcode-project build-ipa \
            --workspace "ios/beakbuddy.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: Codemagic
        key_id: 9T452HQ663
        issuer_id: 4f51e329-5618-4798-9bf8-04ab981312c7
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
