workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "BeakBuddyParrotTrainingAI"
        DEVELOPMENT_TEAM: "LZ57VL6474"
      node: 18.17.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Remove Push Notifications entitlement
        script: |
          ENTITLEMENTS=$(find ios -name "*.entitlements" | head -1)
          if [ -n "$ENTITLEMENTS" ]; then
            plutil -remove aps-environment "$ENTITLEMENTS" 2>/dev/null || true
            echo "Stripped aps-environment from $ENTITLEMENTS"
          fi

      - name: Patch Podfile for Firebase compatibility
        script: |
          python3 -c "f='ios/Podfile'; t=open(f).read(); open(f,'w').write(t.replace('use_expo_modules!','use_modular_headers!\n  use_expo_modules!',1) if 'use_modular_headers!' not in t else t)"
          grep -n 'use_modular_headers\|use_expo_modules' ios/Podfile || echo "WARNING: pattern not found in Podfile"

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Set up code signing
        script: |
          # macOS LibreSSL syntax: bits come LAST
          openssl genrsa -out /tmp/cert_key.pem 2048
          echo "Key format: $(head -1 /tmp/cert_key.pem)"
          openssl rsa -in /tmp/cert_key.pem -check -noout && echo "Key is valid ✓"

          keychain initialize

          # Delete any existing Distribution certs to avoid 409 on future builds
          app-store-connect certificates list --type DISTRIBUTION 2>/dev/null \
            | grep -oE '^[A-Z0-9]{8,}' \
            | while read CERT_ID; do
                app-store-connect certificates delete "$CERT_ID" 2>/dev/null && echo "Deleted cert $CERT_ID" || true
              done || true

          # Create Distribution cert + App Store provisioning profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/cert_key.pem

          keychain add-certificates

          # Extract profile UUID for explicit manual signing (avoids node_modules xcodeproj issues)
          PROFILE=$(find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                    "$HOME/Library/MobileDevice/Provisioning Profiles" \
                    -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PROFILE" ]; then
            echo "ERROR: No provisioning profile found"
            exit 1
          fi
          UUID=$(security cms -D -i "$PROFILE" \
                 | python3 -c "import sys,plistlib; print(plistlib.loads(sys.stdin.buffer.read())['UUID'])")
          echo "Profile UUID: $UUID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "$UUID" > /tmp/profile_uuid.txt

      - name: Build iOS Archive
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          PROFILE_UUID=$(cat /tmp/profile_uuid.txt)
          echo "Using workspace: $WORKSPACE"
          echo "Using profile UUID: $PROFILE_UUID"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/beakbuddy.xcarchive" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"

      - name: Export IPA
        script: |
          python3 -c "import plistlib; p={'method':'app-store-connect','teamID':'LZ57VL6474','signingStyle':'manual','destination':'export'}; plistlib.dump(p,open('/tmp/ExportOptions.plist','wb'),fmt=plistlib.FMT_XML); print('ExportOptions.plist written')"
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/beakbuddy.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output" \
            -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - $CM_BUILD_DIR/output/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: Codemagic
        key_id: 9T452HQ663
        issuer_id: 4f51e329-5618-4798-9bf8-04ab981312c7
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
