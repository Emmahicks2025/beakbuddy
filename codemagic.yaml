workflows:
  beakbuddy-ios-appstore:
    name: BeakBuddy iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic   # Uses the API key already saved in team settings

    environment:
      vars:
        BUNDLE_ID: "com.beakbuddy.app"
        XCODE_SCHEME: "BeakBuddyParrotTrainingAI"
        DEVELOPMENT_TEAM: "LZ57VL6474"
      node: 18.17.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile for Firebase compatibility
        script: |
          sed -i '' "s/  use_expo_modules!/  use_modular_headers!\n  use_expo_modules!/" ios/Podfile

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Set up automatic code signing
        script: |
          # Generate a fresh RSA private key for the distribution certificate.
          # This sidesteps "Cannot save Signing Certificates without certificate
          # private key" — instead of trying to reuse an existing cert whose
          # private key isn't available, we supply our own key and --create
          # makes a brand-new cert signed by it.
          openssl genrsa -out /tmp/cert_key.pem 2048

          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/cert_key.pem

          keychain add-certificates
          xcode-project use-profiles || true

      - name: Build and export IPA
        script: |
          # maxdepth 1 finds ios/BeakBuddyParrotTrainingAI.xcworkspace (CocoaPods)
          # NOT ios/BeakBuddyParrotTrainingAI.xcodeproj/project.xcworkspace (internal)
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          echo "Using workspace: $WORKSPACE"

          # xcode-project use-profiles normally writes this file, but since we
          # ran it with || true it may not have been created — write it explicitly
          cat > /tmp/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>LZ57VL6474</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --export-options-plist /tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: Codemagic
        key_id: 9T452HQ663
        issuer_id: 4f51e329-5618-4798-9bf8-04ab981312c7
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - emmahicks2022@gmail.com
        notify:
          success: true
          failure: true
